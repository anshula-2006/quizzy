<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quizzy Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./design-system.css" />
  <link rel="stylesheet" href="./app.css" />
  <link rel="stylesheet" href="./auth.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-grid two-col">
      <aside class="auth-hero-panel">
        <a class="brand-row" href="./index.html" aria-label="Quizzy home">
          <div class="brand-badge-hero">Q</div>
          <div class="brand-copy">
            <strong class="brand-name">Quizzy</strong>
            <span class="brand-tag">Learn Smarter. Practice Better.</span>
          </div>
        </a>

        <div class="hero-copy">
          <h1 class="hero-title">Create your account</h1>
          <p class="hero-sub">Sign up to generate quizzes, save flashcards and track your learning growth.</p>
        </div>
      </aside>

      <main class="auth-card" role="main">
        <div class="auth-card-head">
          <p class="auth-eyebrow">Create account</p>
          <h2 class="auth-title">Get started</h2>
          <p class="section-copy">One account gives you quiz generation, saved history, and leaderboard access.</p>
        </div>

        <form id="registerForm" class="auth-form" aria-labelledby="registerForm">
          <div class="field-stack">
            <label class="field-label" for="name">Full name</label>
            <input id="name" name="name" type="text" autocomplete="name" placeholder="Your full name" required class="auth-input" />
          </div>

          <div class="field-stack">
            <label class="field-label" for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required class="auth-input" />
          </div>

          <div class="field-stack">
            <label class="field-label" for="password">Password</label>
            <div class="input-action-group">
              <input id="password" name="password" type="password" autocomplete="new-password" placeholder="At least 6 characters" required class="auth-input" />
              <button type="button" id="togglePasswordBtn" class="input-action-btn" aria-label="Toggle password visibility">👁</button>
            </div>
            <div class="password-strength" aria-live="polite">
              <span></span>
              <em id="passwordStrengthText">Use 6+ characters</em>
            </div>
          </div>

          <div class="field-stack">
            <label class="field-label" for="confirmPassword">Confirm password</label>
            <div class="input-action-group">
              <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Repeat your password" required class="auth-input" />
              <button type="button" id="toggleConfirmPasswordBtn" class="input-action-btn" aria-label="Toggle password visibility">👁</button>
            </div>
          </div>

          <!-- Keep optional hidden fields to avoid breaking existing registration logic -->
          <input type="hidden" id="userId" name="userId" value="" />
          <input type="hidden" id="userType" name="userType" value="student" />

          <div class="auth-actions">
            <button id="registerSubmitBtn" class="btn primary auth-btn" type="submit">Create account</button>
          </div>

          <div class="auth-links">
            <a href="./login.html" class="helper-link">Already have an account? Sign in</a>
          </div>

          <p id="message" class="auth-msg" aria-live="polite"></p>
        </form>
      </main>
    </div>
  </div>

  <script type="module" src="./js/page-auth.js"></script>
  <script type="module" src="register.js"></script>
</body>
</html>
