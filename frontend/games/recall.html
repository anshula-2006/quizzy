<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Number Recall | Brain Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../design-system.css" />
  <link rel="stylesheet" href="../app.css" />
</head>
<body>
  <div class="page-shell">
    <div class="page-container">
      <header class="top-nav">
        <a class="brand" href="../index.html"><span class="brand-badge">Q</span><span>Quizzy</span></a>
        <nav class="nav-links">
          <a class="nav-link" href="../arcade.html">Back to Brain Lab</a>
        </nav>
      </header>

      <main class="panel flow-card mini-game-shell recall-game-shell">
        <div class="card-title-row">
          <div>
            <p class="eyebrow">Brain Lab</p>
            <h1 class="section-title">Number Recall</h1>
            <p class="section-copy">Strengthen working memory by encoding a sequence, hiding it, then reproducing it.</p>
          </div>
          <div class="mini-game-stats">
            <div class="dash-stat-card">
              <span class="saas-stat-label">Level</span>
              <strong id="levelValue" class="saas-stat-value">3</strong>
            </div>
          </div>
        </div>

        <div class="button-row section-gap">
          <button id="startRecallBtn" class="btn" type="button">Start Round</button>
        </div>

        <div class="recall-stage section-gap" style="display: grid; place-items: center; text-align: center;">
          <div id="sequenceDisplay" class="heading-2 text-primary" style="letter-spacing: 0.25em;">Press start to begin</div>
        </div>

        <form id="recallForm" class="recall-form section-gap" autocomplete="off" style="max-width: 480px; margin: var(--space-6) auto 0;">
          <div class="field-stack">
            <input id="recallInput" class="text-input" type="text" inputmode="numeric" placeholder="Enter the sequence" style="text-align: center; font-size: var(--font-size-lg); letter-spacing: 0.1em;" />
            <button class="btn" type="submit" style="width: 100%;">Submit</button>
            <p id="recallFeedback" class="helper-text" style="text-align: center; margin: 0; min-height: 24px;"></p>
          </div>
        </form>
      </main>
    </div>
  </div>

  <script type="module" src="../js/page-auth.js"></script>
  <script type="module" src="../js/games/recall.js"></script>
</body>
</html>
