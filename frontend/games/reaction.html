<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reaction Tap | Mini Arcade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../design-system.css" />
  <link rel="stylesheet" href="../app.css" />
</head>
<body>
  <div class="page-shell">
    <div class="page-container">
      <header class="top-nav">
        <a class="brand" href="../index.html"><span class="brand-badge">Q</span><span>Quizzy</span></a>
        <nav class="nav-links">
          <a class="nav-link" href="../arcade.html">← Back to Arcade</a>
        </nav>
      </header>

      <main class="panel flow-card">
        <div class="card-title-row">
          <div>
            <p class="eyebrow">Mini Arcade</p>
            <h1 class="section-title">Reaction Tap</h1>
            <p class="section-copy">Train attention control: wait for the signal, then respond with one clean tap.</p>
          </div>
          <div style="display: flex; gap: var(--space-4);">
            <div class="dash-stat-card">
              <span class="saas-stat-label">Best Time</span>
              <strong id="bestReaction" class="saas-stat-value">--</strong>
            </div>
          </div>
        </div>

        <div class="button-row section-gap">
          <button id="startReactionBtn" class="btn" type="button">Start Round</button>
        </div>

        <div class="section-gap">
          <button id="reactionStage" class="reaction-stage waiting" type="button" style="border: none; width: 100%; cursor: pointer;">
            <div id="reactionStatus" style="display: flex; flex-direction: column; align-items: center; gap: var(--space-2);">
              <div class="heading-2">Wait...</div>
              <p class="text-secondary">Press start to begin a round.</p>
            </div>
          </button>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="../js/page-auth.js"></script>
  <script type="module" src="../js/games/reaction.js"></script>
</body>
</html>
