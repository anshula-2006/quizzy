<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings | Quizzy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./design-system.css" />
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <div class="page-shell">
    <div class="page-container">
      <header class="top-nav">
        <a class="brand" href="./index.html"><span class="brand-badge">Q</span><span>Quizzy</span></a>
        <nav class="nav-links">
          <a class="nav-link" href="./index.html">Home</a>
          <a class="nav-link" href="./generate.html">Generate</a>
          <a class="nav-link" href="./flashcards.html">Flashcards</a>
          <a class="nav-link" href="./dashboard.html">Dashboard</a>
          <a class="nav-link" href="./arcade.html">Arcade</a>
          <a class="nav-link" href="./scoreboard.html">Leaderboard</a>
        </nav>
      </header>
      
      <main>
        <section class="card">
          <h1>Settings</h1>
          <p class="section-copy section-gap">Manage your account preferences and application settings.</p>

          <div style="display: grid; gap: 18px; max-width: 900px;">
            <section class="panel">
              <h3>Account</h3>
              <div id="accountInfo" style="display:flex; gap:12px; align-items:center;">
                <div>
                  <div id="accountName" style="font-weight:700"></div>
                  <div id="accountEmail" class="text-secondary" style="font-size:0.9rem;"></div>
                </div>
                <div style="margin-left:auto;">
                  <button id="logoutBtn" class="btn-outline">Logout</button>
                  <button id="logoutAllBtn" class="btn-outline">Logout All Sessions</button>
                </div>
              </div>
            </section>

            <section class="panel">
              <h3>Security</h3>
              <form id="changePasswordForm" style="display:grid; gap:8px; max-width:420px;">
                <input id="oldPassword" type="password" placeholder="Current password" required />
                <input id="newPassword" type="password" placeholder="New password" required />
                <input id="confirmPassword" type="password" placeholder="Confirm new password" required />
                <div style="display:flex; gap:8px;"><button class="btn" type="submit">Change Password</button></div>
              </form>
            </section>

            <section class="panel">
              <h3>Appearance</h3>
              <div style="display:flex; gap:12px; align-items:center;">
                <label><input type="radio" name="theme" value="system" checked> System</label>
                <label><input type="radio" name="theme" value="light"> Light</label>
                <label><input type="radio" name="theme" value="dark"> Dark</label>
              </div>
            </section>

            <section class="panel">
              <h3>Danger Zone</h3>
              <p class="section-copy">Permanently delete your account and all associated data.</p>
              <div style="display:flex; gap:12px;"><button id="deleteAccountBtn" class="btn-outline" style="border-color:var(--error); color:var(--error);">Delete Account</button></div>
            </section>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="./shared.js"></script>
  <script src="./settings.js"></script>
</body>
</html>
